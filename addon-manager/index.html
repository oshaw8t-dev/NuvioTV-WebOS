<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvio — Gestione Addon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; padding: 24px; min-height: 100vh; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #a855f7; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 12px; }
        .addon-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .addon-item { background: #1a1a1a; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .addon-info { flex: 1; min-width: 0; }
        .addon-name { font-size: 0.95rem; font-weight: 500; }
        .addon-url { font-size: 0.7rem; color: #555; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .remove-btn { background: #3a1a1a; border: none; color: #f87171; border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; flex-shrink: 0; }
        .add-section { background: #1a1a1a; border-radius: 10px; padding: 16px; margin-bottom: 24px; }
        .add-section h3 { font-size: 0.9rem; margin-bottom: 12px; color: #ccc; }
        input { width: 100%; padding: 10px 14px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.9rem; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #a855f7; }
        .add-btn { width: 100%; padding: 12px; background: #a855f7; border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .add-btn:disabled { background: #555; cursor: not-allowed; }
        .save-btn { width: 100%; padding: 14px; background: #16a34a; border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .save-btn:disabled { background: #555; cursor: not-allowed; }
        .message { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; display: none; }
        .message.success { background: #1a3a1a; color: #4ade80; display: block; }
        .message.error { background: #3a1a1a; color: #f87171; display: block; }
        .loading { text-align: center; color: #666; padding: 40px; }
        .empty { color: #666; font-size: 0.85rem; padding: 8px 0; }

        /* TV Login modal */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        .modal h2 { font-size: 1.2rem; margin-bottom: 6px; }
        .modal p { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        .modal input { margin-bottom: 12px; }
        .modal-btn {
            width: 100%; padding: 13px;
            background: #a855f7; border: none;
            border-radius: 10px; color: #fff;
            font-size: 1rem; font-weight: bold;
            cursor: pointer; margin-bottom: 10px;
        }
        .modal-btn:disabled { background: #555; cursor: not-allowed; }
        .modal-btn.secondary { background: #2a2a2a; color: #aaa; }
        .modal-error { color: #f87171; font-size: 0.85rem; margin-bottom: 10px; display: none; }
        .modal-error.visible { display: block; }
        .modal-success-icon { font-size: 3rem; text-align: center; margin-bottom: 12px; }
        .modal-success-title { font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .modal-success-desc { color: #888; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div class="logo">NUVIO</div>
    <div class="subtitle">Gestione Addon dalla TV</div>
    <div id="app"><div class="loading">Caricamento...</div></div>

    <!-- TV Login modal -->
    <div class="modal-overlay" id="tvLoginModal">
        <div class="modal" id="tvLoginModalContent"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://xuonpifwlrutnnzisovs.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1b25waWZ3bHJ1dG5uemlzb3ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMzU5MTEsImV4cCI6MjA4NzYxMTkxMX0.3d_GgCEcx3D1qq0v83ozJCEQSz4JjqtGD3t_CL395qU';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    // Stato globale addon
    let addonUrls = [];
    let addonNames = {};
    let renderPending = false;

    // ─── Supabase helpers ────────────────────────────────────────────────────

    async function rpc(fn, body, authToken) {
        const token = authToken || SUPABASE_ANON_KEY;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${token}`
            },
            body: JSON.stringify(body)
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : null;
        if (!res.ok) throw new Error(JSON.stringify(data));
        return data;
    }

    async function signInWithEmail(email, password) {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error_description || data?.msg || 'Login fallito');
        return data; // { access_token, refresh_token, ... }
    }

    // ─── TV Login Flow ────────────────────────────────────────────────────────

    async function approveTvLogin(code, userAccessToken) {
        // Prova prima la funzione Edge dedicata all'approvazione
        const edgeFns = [
            `${SUPABASE_URL}/functions/v1/tv-logins-approve`,
            `${SUPABASE_URL}/functions/v1/tv-login-approve`,
        ];
        for (const url of edgeFns) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        apikey: SUPABASE_ANON_KEY,
                        Authorization: `Bearer ${userAccessToken}`
                    },
                    body: JSON.stringify({ code })
                });
                if (res.ok) return { ok: true };
                const txt = await res.text();
                // 404 = funzione non esiste, prova la prossima
                if (res.status === 404) continue;
                throw new Error(txt);
            } catch (e) {
                if (e.message && e.message.includes('fetch')) continue;
                throw e;
            }
        }

        // Fallback: RPC Postgres
        const rpcNames = [
            'approve_tv_login_session',
            'approve_tv_login',
            'confirm_tv_login_session',
        ];
        let lastErr = null;
        for (const fn of rpcNames) {
            try {
                await rpc(fn, { p_code: code }, userAccessToken);
                return { ok: true };
            } catch (e) {
                const msg = String(e.message || '').toLowerCase();
                // "could not find the function" = non esiste, prova il prossimo
                if (msg.includes('could not find') || msg.includes('does not exist') || msg.includes('42883')) {
                    lastErr = e;
                    continue;
                }
                throw e;
            }
        }
        throw lastErr || new Error('Nessuna funzione di approvazione trovata');
    }

    function showTvLoginModal() {
        renderTvLoginForm();
        document.getElementById('tvLoginModal').classList.add('visible');
    }

    function hideTvLoginModal() {
        document.getElementById('tvLoginModal').classList.remove('visible');
    }

    function renderTvLoginForm(errorMsg) {
        const content = document.getElementById('tvLoginModalContent');
        content.innerHTML = `
            <h2>🔐 Login TV</h2>
            <p>Inserisci le tue credenziali per autorizzare l'accesso sulla TV.</p>
            <div class="modal-error ${errorMsg ? 'visible' : ''}" id="modalError">${escapeHtml(errorMsg || '')}</div>
            <input type="email" id="tvEmail" placeholder="Email" autocomplete="email" />
            <input type="password" id="tvPassword" placeholder="Password" autocomplete="current-password" />
            <button class="modal-btn" id="tvLoginBtn" onclick="doTvLogin()">Accedi e autorizza TV</button>
            <button class="modal-btn secondary" onclick="hideTvLoginModal()">Annulla</button>
        `;
        // Enter key submit
        content.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') doTvLogin(); });
        });
    }

    function renderTvLoginSuccess() {
        const content = document.getElementById('tvLoginModalContent');
        content.innerHTML = `
            <div class="modal-success-icon">✅</div>
            <div class="modal-success-title">TV autorizzata!</div>
            <div class="modal-success-desc">Torna alla TV — il login si completerà automaticamente entro qualche secondo.</div>
        `;
    }

    async function doTvLogin() {
        const email = document.getElementById('tvEmail')?.value?.trim();
        const password = document.getElementById('tvPassword')?.value;
        if (!email || !password) {
            renderTvLoginForm('Inserisci email e password.');
            return;
        }

        const btn = document.getElementById('tvLoginBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Accesso in corso...'; }

        try {
            const session = await signInWithEmail(email, password);
            const token = session.access_token;
            if (!token) throw new Error('Token di sessione mancante');

            if (btn) btn.textContent = 'Autorizzazione TV...';
            await approveTvLogin(code, token);

            renderTvLoginSuccess();
        } catch (e) {
            renderTvLoginForm(e.message || 'Errore sconosciuto');
        }
    }

    // ─── Addon manager ───────────────────────────────────────────────────────

    async function fetchManifestName(url) {
        if (addonNames[url]) return addonNames[url];
        try {
            const clean = url.replace(/\/+$/, '').replace(/\/manifest\.json$/, '');
            const res = await fetch(`${clean}/manifest.json`);
            const data = await res.json();
            const name = data.name || extractDomain(url);
            addonNames[url] = name;
            return name;
        } catch {
            const fallback = extractDomain(url);
            addonNames[url] = fallback;
            return fallback;
        }
    }

    function extractDomain(url) {
        try { return new URL(url).hostname; } catch { return url; }
    }

    function formatDisplayUrl(url) {
        try {
            const u = new URL(url);
            const short = u.hostname + (u.pathname !== '/' ? u.pathname : '');
            return short.length > 50 ? short.slice(0, 47) + '...' : short;
        } catch {
            return url.length > 50 ? url.slice(0, 47) + '...' : url;
        }
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderList() {
        const addonList = document.getElementById('addonList');
        if (!addonList) return;
        if (addonUrls.length === 0) {
            addonList.innerHTML = '<div class="empty">Nessun addon installato</div>';
            return;
        }
        addonList.innerHTML = addonUrls.map((url, i) => {
            const name = addonNames[url] || extractDomain(url);
            const displayUrl = formatDisplayUrl(url);
            return `
                <div class="addon-item">
                    <div class="addon-info">
                        <div class="addon-name">${escapeHtml(name)}</div>
                        <div class="addon-url" title="${escapeHtml(url)}">${escapeHtml(displayUrl)}</div>
                    </div>
                    <button class="remove-btn" onclick="removeAddon(${i})">Rimuovi</button>
                </div>
            `;
        }).join('');
    }

    async function refreshNames() {
        if (renderPending) return;
        renderPending = true;
        await Promise.all(addonUrls.map(url => fetchManifestName(url)));
        renderPending = false;
        renderList();
    }

    function buildAppHtml() {
        return `
            <div class="message" id="message"></div>
            <div class="section-title">Addon installati</div>
            <div class="addon-list" id="addonList"></div>
            <div class="add-section">
                <h3>Aggiungi addon</h3>
                <input type="text" id="newUrl" placeholder="https://example.com/manifest.json"
                    autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
                <button class="add-btn" id="addBtn" onclick="addAddon()">Aggiungi</button>
            </div>
            <button class="save-btn" id="saveBtn" onclick="save()">✓ Salva sulla TV</button>
        `;
    }

    function showMessage(text, type) {
        const el = document.getElementById('message');
        if (!el) return;
        el.textContent = text;
        el.className = `message ${type}`;
    }

    function removeAddon(index) {
        addonUrls.splice(index, 1);
        renderList();
        refreshNames();
    }

    function addAddon() {
        const input = document.getElementById('newUrl');
        if (!input) return;
        const raw = input.value.trim();
        const url = raw.replace(/\/manifest\.json$/, '').replace(/\/+$/, '');
        if (!url) return;
        if (addonUrls.includes(url)) {
            showMessage('Addon già presente nella lista.', 'error');
            return;
        }
        addonUrls.push(url);
        input.value = '';
        renderList();
        fetchManifestName(url).then(() => renderList());
    }

    async function save() {
        const btn = document.getElementById('saveBtn');
        if (!btn) return;
        btn.disabled = true;
        btn.textContent = 'Salvataggio...';
        try {
            await rpc('update_addon_sync', { p_code: code, p_addon_urls: addonUrls });
            showMessage('✓ Addon aggiornati! La TV si aggiornerà a breve.', 'success');
            btn.textContent = '✓ Salvato!';
        } catch (e) {
            showMessage('Errore: ' + e.message, 'error');
            btn.disabled = false;
            btn.textContent = '✓ Salva sulla TV';
        }
    }

    // ─── Entry point ─────────────────────────────────────────────────────────

    async function load() {
        if (!code) {
            document.getElementById('app').innerHTML = '<div class="loading">Codice mancante nell\'URL</div>';
            return;
        }

        // Prova prima get_addon_sync (flusso normale addon manager)
        try {
            const result = await rpc('get_addon_sync', { p_code: code });
            const row = Array.isArray(result) ? result[0] : result;
            if (!row) throw new Error('Sessione non trovata o scaduta');

            // Successo → siamo in modalità addon manager
            addonUrls = Array.isArray(row.addon_urls) ? [...row.addon_urls] : [];
            document.getElementById('app').innerHTML = buildAppHtml();
            renderList();
            refreshNames();

            // Se c'è anche un login TV pendente, mostralo in overlay
            if (row.tv_login_pending === true || row.requires_tv_login === true) {
                showTvLoginModal();
            }
            return;
        } catch (e) {
            const msg = String(e.message || '').toLowerCase();
            // "not found" / "expired" = codice addon, ma scaduto
            if (!msg.includes('could not find') && !msg.includes('does not exist') && !msg.includes('42883')) {
                // Errore reale addon sync (non "funzione mancante") → potrebbe essere un TV login code
                // Mostriamo sia l'app normale vuota sia il modal di TV login
                console.warn('get_addon_sync error, assuming TV login code:', e.message);
            }
        }

        // Fallback: mostra direttamente il modal di TV login
        document.getElementById('app').innerHTML = buildAppHtml();
        renderList();
        showTvLoginModal();
    }

    load();
</script>
</body>
</html>
